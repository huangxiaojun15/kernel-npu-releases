name: Build and Release SGL-Kernel-NPU

on:
  release:
    types:
      - published

jobs:
  build-and-release:
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [aarch64]
        npu_hardware: [950]
        cann_version: [9.3.0]
        torch_version: [2.10.0]
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: swr.cn-north-4.myhuaweicloud.com/sglang/cann9.3.0-openeuler24.03:20261009-py312

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Mark repository safe
        run: |
          git config --system --add safe.directory ${GITHUB_WORKSPACE}

      - name: Install dependency
        run: |
          bash scripts/cann930-npu_ci_install_dependency.sh --cann-version ${{ matrix.cann_version }}

      - name: Clone sgl-kernel-npu source
        run: |
          cd "${GITHUB_WORKSPACE}/.."
          git clone --recursive https://github.com/sgl-project/sgl-kernel-npu.git sgl-kernel-npu
          cd sgl-kernel-npu
          git submodule update --init --recursive
          git log -1 --oneline

      - name: Build SGL-Kernel-NPU for 950
        if: matrix.npu_hardware == '950'
        run: |
          cd "${GITHUB_WORKSPACE}/../sgl-kernel-npu"
          env -i PATH=${PATH} bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} && \
            ./build.sh -a kernels Ascend950PR_9599
          "

      - name: Build Attentions
        run: |
          cd "${GITHUB_WORKSPACE}/../sgl-kernel-npu"
          env -i PATH=${PATH} bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} && \
            ./build.sh -a attentions
          "

      - name: Build Torch-Memory-Saver
        run: |
          cd "${GITHUB_WORKSPACE}/../sgl-kernel-npu"
          env -i PATH=${PATH} bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} && \
            ./build.sh -a memory-saver
          "

      - name: Build DeepEP for 950
        if: matrix.npu_hardware == '950'
        run: |
          cd "${GITHUB_WORKSPACE}/../sgl-kernel-npu"
          env -i PATH=${PATH} bash --login -c "
            export LD_LIBRARY_PATH=${ASCEND_HOME_PATH}/runtime/lib64/stub:${LD_LIBRARY_PATH} && \
            ./build.sh -a deepep Ascend950
          "
      - name: Pack up packages
        run: |
          export TORCH_DEVICE_BACKEND_AUTOLOAD=0
          TORCH_VERSION=$(python3 -c "import torch; print(torch.__version__)" | awk -F'+' '{print $1}')
          PYTHON_VERSION=$(python3 -c "import platform; print(platform.python_version())" | awk -F'.' '{print $1$2}')
          PACKAGE_NAME="sgl-kernel-npu-${{ github.event.release.tag_name }}-torch${TORCH_VERSION}-py${PYTHON_VERSION}-cann${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-${{ matrix.arch }}.zip"
          cd "${GITHUB_WORKSPACE}/../sgl-kernel-npu/output"
          zip -v ${PACKAGE_NAME} ./*.whl
          ls -al

      - name: Upload Release Artifacts
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ../sgl-kernel-npu/output/*.zip

  build-ops-transformer:
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [ aarch64 ]
        npu_hardware: [ 950 ]
        cann_version: [ 9.3.0 ]
        torch_version: [ 2.10.0 ]
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: swr.cn-north-4.myhuaweicloud.com/sglang/cann9.3.0-openeuler24.03:20261009-py312

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Mark repository safe
        run: |
          git config --system --add safe.directory ${GITHUB_WORKSPACE}

      - name: Install dependency
        run: |
          bash scripts/cann930-npu_ci_install_dependency.sh --cann-version ${{ matrix.cann_version }}

      - name: Debug tag info
        if: github.event_name == 'release'
        run: |
          echo "github.ref = ${{ github.ref }}"
          echo "tag from release event = ${{ github.event.release.tag_name }}"

      - name: Build ops-transformer for 950
        if: matrix.npu_hardware == '950'
        run: |
          cd ../
          git clone https://gitcode.com/cann/ops-transformer.git
          cd ops-transformer
          git checkout bcc6304
          env -i PATH=${PATH} bash --login -c "
            pip install packaging
            bash build.sh --pkg --experimental --soc=ascend950 --ops=\"quant_lightning_indexer,quant_lightning_indexer_metadata,compressor,kv_quant_sparse_attn_sharedkv,kv_quant_sparse_attn_sharedkv_metadata,kv-compressor_epilog,hc_post,inplace_partial_rotary_mul,indexer_compress_epilog,moe_gating_top_k\"
          "

      - name: Pack up packages
        run: |
          PACKAGE_NAME="ops-transformer-${{ github.event.release.tag_name }}-torch${{ matrix.torch_version }}-cann${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-${{ matrix.arch }}.zip"
          cd ../ops-transformer/build_out
          zip -v ${PACKAGE_NAME} ./*.run
          ls -al

      - name: Upload Release Artifacts
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ../ops-transformer/build_out/*.zip

  build-cuntom-ops:
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    strategy:
      matrix:
        arch: [ aarch64 ]
        npu_hardware: [ 950 ]
        cann_version: [ 9.3.0 ]
        torch_version: [ 2.10.0 ]
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: swr.cn-north-4.myhuaweicloud.com/sglang/cann9.3.0-openeuler24.03:20261009-py312
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Mark repository safe
        run: |
          git config --system --add safe.directory ${GITHUB_WORKSPACE}

      - name: Install dependency
        run: |
          bash scripts/cann930-npu_ci_install_dependency.sh --cann-version ${{ matrix.cann_version }}

      - name: Debug tag info
        if: github.event_name == 'release'
        run: |
          echo "github.ref = ${{ github.ref }}"
          echo "tag from release event = ${{ github.event.release.tag_name }}"


      - name: Build cann-custom for 950
        if: matrix.npu_hardware == '950'
        run: |
          cd ../
          git clone https://gitcode.com/cann/cann-recipes-infer.git
          cd cann-recipes-infer
          git checkout 35a476c
          env -i PATH=${PATH} bash --login -c "
            cd ops/ascendc/torch_ops_extension
            pip install ninja
            bash build_and_install.sh
          "
          env -i PATH=${PATH} bash --login -c "
            cd ops/ascendc
            bash build.sh -c \"ascend950\"
          "

      - name: Pack up packages
        run: |
          PACKAGE_NAME="custom-ops-${{ github.event.release.tag_name }}-torch${{ matrix.torch_version }}-cann${{ matrix.cann_version }}-${{ matrix.npu_hardware }}-${{ matrix.arch }}.zip"
          cd ../cann-recipes-infer
          mkdir output
          cp ./ops/ascendc/torch_ops_extension/dist/custom_ops-*.whl ./output
          cp ./ops/ascendc/output/CANN-custom_ops-*.run ./output
          cd output
          zip -v ${PACKAGE_NAME} ./*.run ./*.whl
          ls -al

      - name: Upload Release Artifacts
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ../cann-recipes-infer/output/*.zip
