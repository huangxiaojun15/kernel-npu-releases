name: Image Dependency Manifest

# 【分支模式】把本文件复制成 .github/workflows/image-manifest.yml 使用。
# 与默认版本的区别：不用 GitHub Actions 当 Pages 源，而是直接用
# "Deploy from a branch -> main -> /docs" 发布。
#
# 对应设置：Settings -> Pages -> Source 选 "Deploy from a branch"，
#          分支选 main，目录必须选 /docs（GitHub 只允许 / 或 /docs 两个目录）。
#
# 这意味着站点文件要放在 docs/ 下，数据文件是 docs/manifests/manifests.json。
# 本 workflow 只负责把数据写回 main，剩下的交给 GitHub 自动重建。

on:
  workflow_dispatch:
    inputs:
      images:
        description: "要采集的镜像，一行一个 registry/repo:tag"
        required: true
        type: string
        default: |
          python:3.12-slim
      sglang_dir:
        required: false
        type: string
        default: "/sgl-workspace/sglang"
      dockerfile:
        required: false
        type: string
        default: ""
      build_args:
        required: false
        type: string
        default: ""
      registry:
        required: false
        type: string
        default: ""
      runner:
        required: false
        type: string
        default: "ubuntu-latest"
      free_disk:
        required: false
        type: string
        default: "true"

  workflow_call:
    inputs:
      images:
        required: true
        type: string
      sglang_dir:
        required: false
        type: string
        default: "/sgl-workspace/sglang"
      dockerfile:
        required: false
        type: string
        default: ""
      build_args:
        required: false
        type: string
        default: ""
      registry:
        required: false
        type: string
        default: ""
      runner:
        required: false
        type: string
        default: "ubuntu-latest"
      free_disk:
        required: false
        type: string
        default: "true"
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false

# 分支模式只需要写权限；发布由 GitHub 自己按 push 触发
permissions:
  contents: write

concurrency:
  group: image-manifest-branch
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.parse.outputs.entries }}
    steps:
      - name: Parse image list
        id: parse
        env:
          RAW_IMAGES: ${{ inputs.images }}
        run: |
          set -euo pipefail
          ENTRIES="$(printf '%s\n' "$RAW_IMAGES" \
            | sed 's/[[:space:]]*$//' \
            | sed '/^$/d' \
            | jq -R . \
            | jq -sc 'map({image: ., slug: (gsub("[^A-Za-z0-9._-]"; "_"))}) | unique_by(.image)')"
          echo "entries=${ENTRIES}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$ENTRIES" | jq -r '.[] | "  \(.image)  -> artifact: manifest-\(.slug)"'

  collect:
    needs: prep
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        entry: ${{ fromJSON(needs.prep.outputs.entries) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        if: ${{ inputs.free_disk == 'true' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Log in to the image registry
        if: ${{ inputs.registry != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Pull image and collect what is actually inside
        env:
          IMAGE: ${{ matrix.entry.image }}
          SGLANG_DIR: ${{ inputs.sglang_dir }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --rm -i -e SGLANG_DIR --entrypoint /bin/bash "$IMAGE" \
            -c 'python3 - "$SGLANG_DIR"' \
            < .github/workflows/extract_image_data.py > image-data.json
          echo "::group::image-data.json"
          cat image-data.json
          echo "::endgroup::"

      - name: Merge with Dockerfile declarations
        env:
          IMAGE: ${{ matrix.entry.image }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          BUILD_ARGS: ${{ inputs.build_args }}
        run: |
          set -euo pipefail
          printf '%s\n' "$BUILD_ARGS" > build-args.txt
          python3 .github/workflows/generate_image_manifest.py \
            --image "$IMAGE" \
            --dockerfile "$DOCKERFILE" \
            --image-data image-data.json \
            --build-args-file build-args.txt \
            --output image-manifest.json
          echo "::group::image-manifest.json"
          cat image-manifest.json
          echo "::endgroup::"

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.entry.slug }}
          path: image-manifest.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all manifests
        uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: manifests-in
          merge-multiple: true

      - name: Upsert into docs/manifests/manifests.json
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(manifests-in/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::没有拿到任何清单"
            exit 1
          fi
          for f in "${files[@]}"; do
            python3 .github/workflows/upsert_manifest.py \
              docs/manifests/manifests.json "$f"
          done

      - name: Commit the data file back to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/manifests/manifests.json
          git commit -m "chore(pages): update image manifests [skip ci]" --allow-empty
          for attempt in 1 2 3; do
            if git push; then
              echo "已回写 main，剩下的交给 GitHub 按 push 重建 Pages"
              exit 0
            fi
            echo "::warning::push 第 ${attempt} 次失败，拉取最新 main 后重试"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
          echo "::error::回写 main 失败（main 有分支保护？）"
          exit 1
